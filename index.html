  <style>
    /* ==========================================================
       타이포 시스템 — Tailwind 임의값(text-[15px]) 남용을 대체.
       body 접두사로 특이도를 한 단계 올려 Tailwind 유틸리티와의
       충돌(같은 특이도 → 주입 순서에 따라 승자가 바뀌는 문제)을 차단.
       ========================================================== */
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #f1f5f9;
      color: #0f172a;
      font-size: 17px;
      line-height: 1.8;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    body .t-display { font-size: 36px; line-height: 1.15; font-weight: 800; letter-spacing: -0.025em; }
    body .t-h1      { font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: -0.015em; }
    body .t-h2      { font-size: 22px; line-height: 1.4;  font-weight: 800; letter-spacing: -0.01em; }
    body .t-h3      { font-size: 19px; line-height: 1.5;  font-weight: 700; }
    body .t-body    { font-size: 17px; line-height: 1.8;  font-weight: 400; }
    body .t-small   { font-size: 16px; line-height: 1.75; }
    body .t-meta    { font-size: 16px; line-height: 1.65; }
    body .t-label   { font-size: 16px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }

    /* 본문 가독성: 한국어에서 양쪽정렬은 어절 사이가 벌어져 오히려 읽기 어려움 → 왼쪽 정렬 */
    body .prose-ko { text-align: left; white-space: pre-line; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fade-in 0.35s ease-out forwards; }
    @keyframes scale-in { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .animate-scale-in { animation: scale-in 0.18s ease-out forwards; }

    /* 분석 중 표시 — '동작 줄이기' 설정에서도 반드시 회전해야 하므로 전용 애니메이션 사용 */
    @keyframes spinner-rotate { to { transform: rotate(360deg); } }
    .spinner-ring {
      width: 84px; height: 84px; border-radius: 50%;
      border: 7px solid #e2e8f0; border-top-color: #2563eb; border-right-color: #2563eb;
      animation: spinner-rotate 0.9s linear infinite;
      will-change: transform;
    }

    input[type=range] { height: 28px; }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; height: 30px; width: 30px; border-radius: 50%;
      background: #4f46e5; cursor: pointer; box-shadow: 0 2px 10px rgba(79,70,229,.4); margin-top: -13px;
    }
    input[type=range]::-webkit-slider-runnable-track { height: 4px; background: #cbd5e1; border-radius: 999px; }

    /* 키보드 포커스 가시성 */
    :focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; border-radius: 8px; }

    /* 하단 고정 바 — 홈 인디케이터 영역 회피 */
    .dock { padding-bottom: calc(18px + env(safe-area-inset-bottom)); }
    .dock-space { padding-bottom: calc(160px + env(safe-area-inset-bottom)); }

    @media (prefers-reduced-motion: reduce) {
      *:not(.spinner-ring), *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
      .spinner-ring { animation-duration: 1.4s !important; }
    }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
  </style>
</head>

      /* =========================================================

         ========================================================= */
      const TREND_DATA = {
        "2024": [
          { code: "T24-01", kr: "분초사회", en: "Time-efficient Society", summary: "시간의 가치가 돈보다 훨씬 중요해지면서 1분 1초를 조각내어 효율성을 극대화하는 사회적 현상입니다. 단순히 바쁜 삶을 사는 것을 넘어, 영상 배속 시청이나 요약본 소비처럼 시간의 밀도를 높이려는 노력이 일상화되고 있습니다. '시성비(시간 대비 성능)'가 소비와 경험의 핵심 기준으로 자리 잡았습니다." },
          { code: "T24-02", kr: "호모 프롬프트", en: "Homo Promptus", summary: "생성형 AI 기술이 일상화됨에 따라, 기술적 지식 그 자체보다는 AI에게 적절한 질문(프롬프트)을 던져 원하는 결과물을 이끌어내는 능력이 중요해졌습니다. 인간 고유의 창의성과 AI의 연산 능력을 결합하여 최상의 결과물을 만들어내는 'AI 활용 능력'이 핵심 경쟁력이 된 신인류를 뜻합니다." },
          { code: "T24-03", kr: "육각형 인간", en: "Hexagonal Human", summary: "외모, 학력, 자산, 성격, 직업, 집안 등 모든 조건이 완벽하게 갖춰진, 마치 육각형 그래프가 꽉 찬 상태의 인간상을 선망하는 문화적 세태입니다. 완벽을 추구하는 사회적 압박 속에서도, 이를 하나의 놀이나 밈(meme)으로 소비하며 이상향과 현실 사이의 괴리를 해소하려는 경향을 보입니다." },
          { code: "T24-04", kr: "버라이어티 가격", en: "Variable Pricing", summary: "동일한 상품이나 서비스라도 구매하는 시간, 장소, 소비자의 상황, 그리고 실시간 수요 공급에 따라 가격이 시시각각 변하는 현상입니다. '일물일가(하나의 물건에 하나의 가격)'의 법칙이 무너지고, 데이터와 AI 기술을 기반으로 한 개인화된 가격 전략이 시장 전반으로 확대되고 있습니다." },
          { code: "T24-05", kr: "도파밍", en: "Dopamine Farming", summary: "즐거움과 쾌락을 전달하는 뇌 신경전달물질 '도파민'과 게임 용어인 '파밍(수집)'을 결합한 말입니다. 숏폼 콘텐츠나 랜덤 박스처럼 짧고 강렬한 재미, 예측 불가능한 보상을 끊임없이 찾아다니는 소비 행태를 의미하며, 즉각적인 만족을 추구하는 현대인의 심리를 반영합니다." },
          { code: "T24-06", kr: "요즘 남편", en: "Millennial Hubbies", summary: "과거의 권위적인 가장의 모습에서 탈피하여 가사와 육아, 가족 관계에 능동적이고 적극적으로 참여하는 밀레니얼 세대 남편들을 지칭합니다. 가사 노동을 돕는 것이 아니라 '함께' 하는 것으로 인식하며, 결혼 생활을 파트너십의 관점에서 바라보는 변화된 라이프스타일을 보여줍니다." },
          { code: "T24-07", kr: "스핀오프", en: "Spin-off Projects", summary: "영화나 드라마의 파생작처럼, 본업이나 본래의 자아를 유지하면서도 새로운 분야로 확장하거나 사이드 프로젝트를 통해 정체성을 다각화하는 현상입니다. 기업은 브랜드 라인업을 확장하고, 개인은 '부캐'를 통해 새로운 가능성을 탐색하며 유연하게 자아를 실현하는 방식을 의미합니다." },
          { code: "T24-08", kr: "디토 소비", en: "Ditto Consumption", summary: "정보 과잉 시대에 복잡한 가치 판단 과정을 생략하고, 자신이 신뢰하는 인플루언서나 취향이 맞는 사람, 특정 커뮤니티의 선택을 그대로 따라 구매하는 방식입니다. '나도(Ditto)'라는 뜻처럼, 소비의 실패를 줄이고 시간을 아끼기 위해 타인의 큐레이션을 적극적으로 수용하는 태도입니다." },
          { code: "T24-09", kr: "리퀴드폴리탄", en: "Liquidpolitan", summary: "정주하는 인구 중심의 도시가 아니라, 다양한 라이프스타일과 취향을 가진 사람들이 유연하게 모이고 흩어지는 '액체(Liquid)' 같은 도시를 의미합니다. 지역의 고유한 콘텐츠나 경험을 찾아 방문하는 유동 인구가 도시의 활력을 결정하며, 지역 소멸 위기의 새로운 해법으로 주목받고 있습니다." },
          { code: "T24-10", kr: "돌봄 경제", en: "Care Economy", summary: "초고령화 사회 진입과 1인 가구 증가로 인해 '돌봄'이 가족의 영역을 넘어 사회적, 경제적 가치를 창출하는 핵심 산업으로 부상하고 있습니다. 육체적 돌봄뿐만 아니라 정서적, 관계적 돌봄까지 포함하며, 기술과 결합된 돌봄 서비스가 새로운 비즈니스 기회를 창출하고 있습니다." }
        ],
        "2025": [
          { code: "T25-01", kr: "옴니보어", en: "Omnivore", summary: "특정 세대나 성별, 소득 수준에 따른 전형적인 소비 패턴이 사라지고, 경계를 허물며 다양한 취향을 섭렵하는 '잡식성' 소비자를 의미합니다. 럭셔리 제품과 저가 제품을 동시에 소비하거나, 나이와 상관없이 새로운 문화를 즐기는 등 집단적 특성보다는 개인의 고유한 취향이 소비를 결정하는 핵심 요인이 됩니다." },
          { code: "T25-02", kr: "#아보하", en: "Ordinary Day", summary: "'아주 보통의 하루'를 줄인 말로, 남들에게 과시할 만한 특별한 성공이나 행운보다는 별다른 문제 없이 지나가는 평온한 일상에 감사하고 만족하는 태도입니다. SNS의 과시적 행복에 피로감을 느끼고, 무탈하고 안온한 삶 그 자체를 소중히 여기는 정서적 트렌드를 반영합니다." },
          { code: "T25-03", kr: "토핑경제", en: "Topping Economy", summary: "완성된 제품을 그대로 소비하는 것에 만족하지 않고, 자신의 취향과 개성에 맞춰 '토핑'을 얹듯 커스터마이징하는 과정에 더 큰 가치를 두는 현상입니다. 신발 꾸미기나 다이어리 꾸미기처럼, 기본 제품에 나만의 창의성을 더해 세상에 하나뿐인 결과물을 만들어내는 참여형 소비 문화입니다." },
          { code: "T25-04", kr: "페이스테크", en: "Face-tech", summary: "차가운 기술에 따뜻한 감성을 입혀, 기계나 AI가 인간의 표정을 읽고 반응하거나 사람처럼 자연스러운 표정을 구사하여 정서적 교감을 나누는 기술입니다. 기술의 성능보다 사용자가 느끼는 감정적 연결과 사용자 경험(UX)을 중시하며, 휴머노이드 로봇이나 디지털 휴먼 분야에서 두드러집니다." },
          { code: "T25-05", kr: "무해력", en: "Harmless Charm", summary: "자극적이고 유해한 콘텐츠나 경쟁적인 사회 분위기에 지친 사람들이 작고 귀엽고 순수한 대상, 즉 '해롭지 않은' 존재에게서 위로와 힐링을 얻는 현상입니다. 아기, 동물, 엉뚱한 캐릭터 등 무방비하고 순수한 대상에 열광하며, 스트레스 없는 편안한 관계와 콘텐츠를 갈망하는 심리입니다." },
          { code: "T25-06", kr: "그라데이션 K", en: "Gradation K", summary: "한국 문화(K-Culture)가 단일한 색깔이 아니라, 전 세계의 다양한 문화와 섞이며 점진적으로 스펙트럼이 넓어지는 현상입니다. 한국적인 것만을 고집하는 것이 아니라, 현지 문화와 자연스럽게 융합되어 새로운 형태의 K-컬처로 진화하며 글로벌 시장에서 유연하게 확장되는 모습을 보여줍니다." },
          { code: "T25-07", kr: "물성매력", en: "Material Attraction", summary: "디지털화가 가속화될수록 역설적으로 손에 잡히는 물성, 즉 질감, 무게, 향기 등 오감으로 느끼는 아날로그적 경험을 갈망하는 트렌드입니다. 화면 속의 경험으로는 채울 수 없는 실재감과 감각적 만족을 추구하며, 팝업 스토어나 체험형 공간 등 오프라인 경험의 가치가 재조명되고 있습니다." },
          { code: "T25-08", kr: "기후감수성", en: "Climate Sensitivity", summary: "기후 위기를 막연한 지구의 문제가 아니라, 나의 생존과 직결된 시급한 문제로 인식하고 민감하게 반응하는 태도입니다. 단순히 친환경 제품을 구매하는 것을 넘어, 기후 변화에 대응하는 라이프스타일을 실천하고 기업과 정부에 적극적인 변화를 요구하는 '기후 행동주의'적 성향을 보입니다." },
          { code: "T25-09", kr: "공진화 전략", en: "Co-evolution", summary: "승자독식의 무한 경쟁 시대가 저물고, 경쟁자와도 필요하다면 손을 잡고 함께 생태계를 키워나가는 상생과 협력의 비즈니스 전략입니다. 폐쇄적인 독자 생존보다는 개방형 혁신과 파트너십을 통해 상호 의존적으로 성장하며, 급변하는 시장 환경에 유연하게 대응하려는 생존 방식입니다." },
          { code: "T25-10", kr: "원포인트업", en: "One-point Up", summary: "인생을 송두리째 바꾸려는 거대한 자기계발 계획 대신, 지금 당장 실천 가능한 '한 가지'에 집중하여 확실한 성취를 맛보는 성장 전략입니다. 원대한 목표보다는 구체적이고 작은 습관 하나를 개선함으로써 자기 효능감을 높이고, 지속 가능한 성장을 도모하는 실용적인 태도입니다." }

      /* =========================================================

      function esc(v) {
        if (v === null || v === undefined) return "";
        return String(v)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }
      function escAttr(v) { return esc(v); }

      function toast(msg, tone) {
        const live = document.getElementById("toast-region");
        if (live) live.textContent = msg;
        const colors = { ok: "bg-slate-900", warn: "bg-amber-600", error: "bg-red-600", info: "bg-blue-700" };
        const el = document.createElement("div");
        el.textContent = msg;
        el.className = `fixed left-1/2 -translate-x-1/2 ${colors[tone] || colors.ok} text-white px-6 py-3.5 rounded-2xl font-bold z-[10001] animate-fade-in shadow-2xl max-w-[90vw] text-center t-small`;
        el.style.bottom = "calc(96px + env(safe-area-inset-bottom))";
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 2800);
      }

      const uid = () => "p_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

      /* =========================================================
         5. 저장소 — 슬롯 방식(최대 5개) + 예외/용량 처리
         기존: 단일 키에 5초마다 덮어쓰기 → 이전 작업이 조용히 소멸
         ========================================================= */
      const Store = {
        list() {
          try {
            const raw = localStorage.getItem(CONFIG.PROJECTS_KEY);
            const arr = raw ? JSON.parse(raw) : [];
            return Array.isArray(arr) ? arr : [];
          } catch (e) {
            console.warn("저장 목록을 읽지 못했습니다.", e);
            return [];
          }
        },
        _write(list) {
          try {
            localStorage.setItem(CONFIG.PROJECTS_KEY, JSON.stringify(list));
            return true;
          } catch (e) {
            return false;
          }
        },
        save(snapshot, meta) {
          let list = Store.list().filter(p => p.id !== meta.id);
          list.unshift({ id: meta.id, title: meta.title, savedAt: Date.now(), data: snapshot });
          if (list.length > CONFIG.MAX_PROJECTS) list = list.slice(0, CONFIG.MAX_PROJECTS);

          if (Store._write(list)) return { ok: true };

          // 1차 실패: Q&A 기록을 최근 5건으로 줄여 재시도
          const trimmed = list.map((p, i) => i === 0
            ? { ...p, data: { ...p.data, qaHistory: (p.data.qaHistory || []).slice(-5) } }
            : p);
          if (Store._write(trimmed)) return { ok: true, pruned: "qa" };

          // 2차 실패: 가장 오래된 프로젝트를 버리고 재시도
          const reduced = trimmed.slice(0, Math.max(1, trimmed.length - 1));
          if (Store._write(reduced)) return { ok: true, pruned: "oldest" };

          return { ok: false };
        },
        remove(id) {
          const list = Store.list().filter(p => p.id !== id);
          return Store._write(list);
        }
      };

      /* =========================================================
         6. STATE
         ========================================================= */
      function blankProject() {
        return {
          projectId: uid(),
          selectedYear: "2024",

          reasoningResult: null,

      let state = {
        apiKey: sessionStorage.getItem(CONFIG.SESSION_KEY_API) || "",
        step: -1,

        errorMsg: null,
        qaModal: { visible: false, question: "", answer: "" },
        showQaHistory: false,
        ...blankProject()
      };

      // 입력 중인 값은 state에 넣지 않고 별도 보관 → 타이핑마다 재렌더되지 않음
      const drafts = {};
      window.setDraft = (id, v) => { drafts[id] = v; };
      const draft = (id) => drafts[id] || "";

      /* 단계별 산출물 무효화 — 상위 단계를 다시 실행하면 하위 결과를 반드시 폐기.
         (기존 버그: 시나리오를 재생성해도 이전 시나리오 기준의 컨셉·케이스스터디가 남아
          최신 결과인 것처럼 표시되고 리포트에도 섞여 들어감) */
      function invalidateFrom(stage) {
        const patch = {};
        if (stage <= 2) { patch.steepResult = null; }
        if (stage <= 4) { patch.futureScenario = null; patch.selectedScenarioIndex = -1; }
        if (stage <= 6) { patch.reasoningResult = null; patch.selectedInsightIndex = -1; }
        if (stage <= 7) { patch.concepts = []; patch.selectedConceptIndex = -1; }
        if (stage <= 8) { patch.benchmarkResult = null; patch.selectedConceptIndex = -1; }
        return patch;
      }

      function setState(patch) {
        const prevStep = state.step;
        state = { ...state, ...patch };
        window.__state = state;
        render(patch.step !== undefined && patch.step !== prevStep);
      }
      window.setState = setState;
      window.__state = state;

      /* =========================================================
         7. AI 호출 — 취소 / 파싱 방어 / 치명적 오류 즉시 중단
         ========================================================= */
      let activeController = null;

      function parseModelJson(text) {
        let t = String(text).trim();
        t = t.replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/i, "").trim();
        try { return JSON.parse(t); } catch (e) { /* 아래에서 구간 추출 재시도 */ }
        const first = Math.min(...[t.indexOf("{"), t.indexOf("[")].filter(i => i >= 0));
        const last = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
        if (Number.isFinite(first) && last > first) {
          try { return JSON.parse(t.slice(first, last + 1)); } catch (e) { /* fallthrough */ }
        }
        // 기존 코드는 여기서 원본 문자열을 그대로 반환해 이후 렌더에서 터졌음 → 명시적 실패로 전환
        throw new Error("AI 응답을 JSON으로 해석하지 못했습니다. 다시 시도해 주세요.");
      }

      async function callGemini(systemPrompt, userPrompt) {
        const controller = new AbortController();
        activeController = controller;
        const delays = [900, 2200, 5000];
        let lastError = "알 수 없는 오류";

        for (let i = 0; i <= delays.length; i++) {
          try {
            const res = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/${CONFIG.MODEL_NAME}:generateContent?key=${encodeURIComponent(state.apiKey || "")}`,
              {
                method: "POST",
                signal: controller.signal,
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: userPrompt }] }],
                  systemInstruction: { parts: [{ text: systemPrompt }] },
                  generationConfig: { responseMimeType: "application/json", temperature: 0.7, maxOutputTokens: 8192 },
                  safetySettings: [
                    { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }
                  ]
                })
              }
            );

            if (!res.ok) {
              const err = new Error(`요청이 거부되었습니다 (상태 ${res.status}).`);
              err.fatal = [400, 401, 403, 404].includes(res.status); // 재시도해도 결과가 같은 오류
              throw err;
            }

            const data = await res.json();
            const cand = data && data.candidates && data.candidates[0];
            if (cand && cand.finishReason === "MAX_TOKENS") {
              throw new Error("응답이 최대 길이에 도달해 잘렸습니다. 선택한 항목을 줄이고 다시 시도해 주세요.");
            }
            const text = cand && cand.content && cand.content.parts && cand.content.parts[0] && cand.content.parts[0].text;
            if (!text) throw new Error("AI가 빈 응답을 반환했습니다.");
            return parseModelJson(text);

          } catch (err) {
            if (err.name === "AbortError") { const e = new Error("__aborted__"); e.aborted = true; throw e; }
            lastError = err.message;
            if (err.fatal || i === delays.length) break;
            await new Promise(r => setTimeout(r, delays[i]));
          }
        }
        throw new Error(lastError);
      }

      // 로딩 상태 + 오류 처리를 한 곳에서 담당
      async function withLoading(msg, fn) {
        setState({ isAnalyzing: true, loadingMsg: msg, errorMsg: null });
        try {
          const out = await fn();
          setState({ isAnalyzing: false });
          return out;
        } catch (err) {
          if (err && err.aborted) { setState({ isAnalyzing: false }); toast("분석을 취소했습니다.", "info"); return null; }
          console.error(err);
          setState({ isAnalyzing: false, errorMsg: err.message || "분석에 실패했습니다." });
          return null;
        } finally {
          activeController = null;
        }
      }

      /* =========================================================
         8. 응답 정규화 — 필드 누락으로 렌더가 죽지 않도록 방어
         ========================================================= */
      const NO_DATA = "이 항목은 AI 응답에 포함되지 않았습니다. ‘AI 수정 지시’로 다시 요청해 보세요.";

      function normSteep(res, keywords) {
        let arr = res;
        if (!Array.isArray(arr)) arr = (res && (res.steepResult || res.results || res.data)) || [];
        if (!Array.isArray(arr)) arr = [];
        const emptySteep = () => ({ social: NO_DATA, tech: NO_DATA, econ: NO_DATA, env: NO_DATA, policy: NO_DATA });
        const normSlot = (slot) => {
          const s = slot && typeof slot === "object" ? slot : {};
          const steep = (s.steep && typeof s.steep === "object") ? s.steep : emptySteep();
          return { desc: typeof s.desc === "string" && s.desc.trim() ? s.desc : NO_DATA, steep };
        };
        return keywords.map((kw, i) => {
          const found = arr.find(a => a && typeof a.keyword === "string" && a.keyword.includes(kw.kr)) || arr[i] || {};
          const tl = (found.timeline && typeof found.timeline === "object") ? found.timeline : {};
          return {
            keyword: found.keyword || kw.kr,
            timeline: { past: normSlot(tl.past), present: normSlot(tl.present) }
          };
        });
      }

      function normScenario(res) {
        let trends = res && Array.isArray(res.trends) ? res.trends : (Array.isArray(res) ? res : (res ? [res] : []));
        trends = trends.filter(t => t && typeof t === "object").map(t => ({
          futureTrendKeyword: t.futureTrendKeyword || t.keyword || "이름 없는 미래 트렌드",
          characteristics: t.characteristics || NO_DATA,
          userScenario: t.userScenario || NO_DATA
        }));
        if (trends.length !== 3) throw new Error("미래 트렌드 3개가 완전하게 생성되지 않았습니다. 다시 시도해 주세요.");
        return { trends: trends.slice(0, 3) };
      }

      function normInsights(res) {
        let list = res && Array.isArray(res.insights) ? res.insights : (Array.isArray(res) ? res : []);
        list = list.filter(x => x && typeof x === "object").map(x => ({
          headline: x.headline || "제목 없는 인사이트",
          description: x.description || NO_DATA
        }));
        if (!list.length) throw new Error("통합 인사이트를 생성하지 못했습니다. 다시 시도해 주세요.");
        return { insights: list };
      }

      function normConcepts(res) {
        let list = Array.isArray(res) ? res : (res && (res.concepts || res.results)) || [];
        if (!Array.isArray(list)) list = [];
        const out = list.filter(c => c && typeof c === "object").map(c => ({
          title: c.title || "이름 없는 컨셉",
          persona: c.persona || "",
          description: c.description || "",
          coreValue: typeof c.coreValue === "string" ? c.coreValue
            : (c.coreValue && typeof c.coreValue === "object"
              ? `Who: ${c.coreValue.who || ""}\nPurpose: ${c.coreValue.purpose || ""}\nService: ${c.coreValue.service || ""}`
              : NO_DATA),
          keyFeatures: Array.isArray(c.keyFeatures)
            ? c.keyFeatures.map(f => (typeof f === "string" ? { title: f, desc: "" } : { title: (f && f.title) || "", desc: (f && f.desc) || "" }))
            : [],
          perspective: state.perspective
        }));
        if (!out.length) throw new Error("디자인 컨셉을 생성하지 못했습니다. 다시 시도해 주세요.");
        return out;
      }

      function normBenchmark(res, fallbackName) {
        const cases = (res && Array.isArray(res.cases) ? res.cases : []).filter(c => c && typeof c === "object").map(c => ({
          caseName: c.caseName || "이름 없는 사례",
          caseCharacteristics: c.caseCharacteristics || NO_DATA,
          successFactor: c.successFactor || NO_DATA,
          businessResult: c.businessResult || NO_DATA,
          expansionFactor: c.expansionFactor || NO_DATA
        }));
        if (!cases.length) throw new Error("참고 사례를 찾지 못했습니다. 다시 시도해 주세요.");
        return { selectedConceptName: (res && res.selectedConceptName) || fallbackName || "", cases };
      }

      /* =========================================================
         9. ACTIONS
         ========================================================= */
      const Actions = {
        cancel() { if (activeController) activeController.abort(); },

        async validateKey() {
          const input = document.getElementById("api-input");
          const key = (input && input.value.trim()) || state.apiKey;
          if (!key) { setState({ errorMsg: "Gemini API 키를 입력해 주세요." }); return; }
          setState({ apiKey: key });
          const ok = await withLoading("키를 확인하는 중", () => callGemini('Reply with JSON: {"status":"OK"}', "connection test"));
          if (ok) {
            sessionStorage.setItem(CONFIG.SESSION_KEY_API, key);
            setState({ step: 0 });
          } else {
            sessionStorage.removeItem(CONFIG.SESSION_KEY_API);
            setState({ apiKey: "" });
          }
        },

        openProject(id) {
          const p = Store.list().find(x => x.id === id);
          if (!p) { toast("해당 프로젝트를 찾을 수 없습니다.", "error"); return; }
          const data = { ...blankProject(), ...p.data, projectId: p.id };
          setState({ ...data, isAnalyzing: false, errorMsg: null, step: lastCompletedStep(data) });
          toast("프로젝트를 열었습니다.", "ok");
        },

        deleteProject(id) {
          if (!confirm("이 프로젝트를 삭제할까요? 되돌릴 수 없습니다.")) return;
          Store.remove(id) ? toast("프로젝트를 삭제했습니다.", "ok") : toast("삭제에 실패했습니다.", "error");
          render(false);
        },

        startNewProject() {
          setState({ ...blankProject(), step: 1, errorMsg: null, showQaHistory: false });
        },

        saveNow() {
          const r = persist(true);
          if (r === "ok") toast("현재 진행 상태를 저장했습니다.", "ok");
          else if (r === "full") toast("저장 공간이 부족합니다. 오래된 프로젝트를 삭제해 주세요.", "error");
        },

        toggleKeyword(code) {
          const item = TREND_DATA[state.selectedYear].find(i => i.code === code);
          if (!item) return;
          let list = [...state.step1Keywords];
          if (list.some(i => i.code === code)) list = list.filter(i => i.code !== code);
          else if (list.length < 2) list.push(item);
          else { toast("트렌드는 최대 2개까지 선택할 수 있습니다.", "warn"); return; }
          setState({ step1Keywords: list, expanded: { ...state.expanded, [code]: true }, ...invalidateFrom(2) });
        },

        async runSteep() {
          const kws = state.step1Keywords;
          if (!kws.length) return;
          const res = await withLoading("과거·현재를 분석하는 중", () =>
            callGemini(PROMPTS["STEEP"], `Keywords:\n${kws.map(k => `- ${k.kr}: ${k.summary}`).join("\n")}`));
          if (res) setState({ steepResult: normSteep(res, kws), step: 2, ...invalidateFrom(4) });
        },

        async runScenario(instruction) {
          const kws = state.step1Keywords;
          const targetYear = Number(draft("targetYear")) || state.targetYear;
          let prompt = `Trends:\n${kws.map(k => `- ${k.kr}: ${k.summary}`).join("\n")}\nPast-present analysis: ${JSON.stringify(state.steepResult)}\nTarget year: ${targetYear}`;
          if (instruction) prompt += `\n[INSTRUCTION]: ${instruction}`;
          const res = await withLoading(instruction ? "미래 트렌드를 수정하는 중" : "미래를 예측하는 중",
            () => callGemini(PROMPTS["SCENARIO"], prompt));
          if (res) {
            drafts["scenario-instruction"] = "";
            drafts["targetYear"] = "";
            setState({ targetYear, futureScenario: normScenario(res), step: 4, selectedScenarioIndex: -1, ...invalidateFrom(6) });
          }
        },

        async runReasoning(instruction) {
          const topic = draft("research-topic").trim() || state.researchTopic;
          if (!topic) { setState({ errorMsg: "추론할 과제를 입력해 주세요." }); return; }
          const trends = state.futureScenario.trends;
          const picked = trends[state.selectedScenarioIndex] || trends[0];
          let prompt = `Task goal: ${topic}
Initial trends: ${state.step1Keywords.map(k => k.kr).join(", ")}
Chosen future trend: ${JSON.stringify(picked)}`;
          if (instruction) prompt += `\n[INSTRUCTION]: ${instruction}`;
          const res = await withLoading(instruction ? "추론 내용을 수정하는 중" : "인사이트를 추론하는 중",
            () => callGemini(PROMPTS["REASONING"], prompt));
          if (res) {
            drafts["reasoning-instruction"] = "";
            setState({ researchTopic: topic, reasoningResult: normInsights(res), step: 6, selectedInsightIndex: -1, ...invalidateFrom(7) });
          }
        },

        async runIdeation(instruction) {
          const insight = state.reasoningResult.insights[state.selectedInsightIndex];
          if (!insight) { setState({ errorMsg: "인사이트를 먼저 선택해 주세요." }); return; }
          let prompt = `Task: ${state.researchTopic}
Perspective: ${state.perspective}
Integrated insight: ${JSON.stringify(insight)}`;
          if (instruction) prompt += `\n[INSTRUCTION]: ${instruction}`;
          const res = await withLoading(instruction ? "컨셉을 수정하는 중" : "디자인 컨셉을 도출하는 중",
            () => callGemini(PROMPTS["CONCEPTS"], prompt));
          if (res) {
            drafts["ideation-instruction"] = "";
            const list = normConcepts(res);
            setState({
              concepts: list,
              allGeneratedConcepts: [...state.allGeneratedConcepts, ...list],
              step: 7,
              ...invalidateFrom(8)
            });
          }
        },

        async runBenchmark(index, instruction) {
          const idx = (index === null || index === undefined) ? state.selectedConceptIndex : index;
          const c = state.concepts[idx];
          if (!c) { setState({ errorMsg: "컨셉을 먼저 선택해 주세요." }); return; }
          let prompt = `Concept: ${c.title}\nCore value: ${c.coreValue}`;
          if (instruction) prompt += `\n[INSTRUCTION]: ${instruction}`;
          const res = await withLoading("유사한 글로벌 사례를 찾는 중",
            () => callGemini(PROMPTS["BENCHMARK"], prompt));
          if (res) {
            drafts["benchmark-instruction"] = "";
            setState({ selectedConceptIndex: idx, benchmarkResult: normBenchmark(res, c.title), step: 8 });
          }
        },

        async askAI(inputId, contextKey) {
          const q = draft(inputId).trim();
          if (!q) { toast("질문을 입력해 주세요.", "warn"); return; }
          const res = await withLoading("답변을 작성하는 중",
            () => callGemini(PROMPTS["ASK_AI"], `Context: ${JSON.stringify(state[contextKey])}\nQuestion: ${q}`));
          if (res) {
            const answer = typeof res === "string" ? res : (res.answer || JSON.stringify(res));
            drafts[inputId] = "";
            setState({ qaModal: { visible: true, question: q, answer }, qaHistory: [...state.qaHistory, { q, a: answer }] });
          }
        }
      };
      window.Actions = Actions;

      /* =========================================================
         10. 단계 이동 규칙
         ========================================================= */
      function stepReady(s) {
        switch (s) {
          case 1: return true;
          case 2: return !!state.steepResult;
          case 3: return !!state.steepResult;
          case 4: return !!state.futureScenario;
          case 5: return !!state.futureScenario && state.selectedScenarioIndex >= 0;
          case 6: return !!state.reasoningResult;
          case 7: return state.concepts.length > 0;
          case 8: return !!state.benchmarkResult;
          default: return false;
        }
      }
      function lastCompletedStep(d) {
        if (d.benchmarkResult) return 8;
        if (d.concepts && d.concepts.length) return 7;
        if (d.reasoningResult) return 6;
        if (d.futureScenario) return 4;
        if (d.steepResult) return 2;
        return 1;
      }

      /* =========================================================
         11. 자동 저장
         ========================================================= */
      let lastSaved = "";
      let quotaWarned = false;

      function snapshot() {
        const { apiKey, isAnalyzing, loadingMsg, errorMsg, qaModal, showQaHistory, step, ...data } = state;
        return data;
      }
      function projectTitle() {
        if (state.researchTopic) return state.researchTopic.slice(0, 40);
        if (state.step1Keywords.length) return state.step1Keywords.map(k => k.kr).join(" + ");
        return "제목 없는 프로젝트";
      }
      function persist(force) {
        if (state.step < 1) return "skip";
        const snap = snapshot();
        const serialized = JSON.stringify(snap);
        if (!force && serialized === lastSaved) return "skip";
        const r = Store.save(snap, { id: state.projectId, title: projectTitle() });
        if (r.ok) {
          lastSaved = serialized;
          if (r.pruned === "oldest" && !quotaWarned) { quotaWarned = true; toast("공간 확보를 위해 가장 오래된 프로젝트를 정리했습니다.", "warn"); }
          return "ok";
        }
        if (!quotaWarned) { quotaWarned = true; toast("저장 공간이 부족해 자동 저장이 중단되었습니다.", "error"); }
        return "full";
      }

      /* =========================================================
         12. 렌더 헬퍼
         ========================================================= */
      function header(title, backStep) {
        const cur = STAGES.find(s => s.n === state.step);
        const next = state.step + 1;
        const showNext = STAGES.some(s => s.n === next) && stepReady(next);
        const pct = cur ? Math.round((cur.n / STAGES.length) * 100) : 0;
        return `
        <header class="fixed top-0 left-0 right-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-200 max-w-[430px] mx-auto">
          <div class="px-3 h-14 flex items-center justify-between gap-1">
            <div class="flex items-center gap-1 overflow-hidden flex-1 min-w-0">
              ${backStep !== undefined ? `<button type="button" aria-label="이전 단계로" onclick="setState({step:${backStep}})" class="p-2.5 rounded-full hover:bg-slate-100 active:bg-slate-200 text-slate-600 flex-shrink-0"><i data-lucide="chevron-left" class="w-6 h-6"></i></button>` : ""}
              <h1 class="t-h3 truncate text-slate-900">${esc(title)}</h1>
            </div>
            <div class="flex items-center gap-0.5 flex-shrink-0 text-slate-600">
              ${showNext ? `<button type="button" aria-label="다음 단계로" onclick="setState({step:${next}})" class="p-2.5 rounded-full hover:bg-slate-100 active:bg-slate-200 text-slate-900"><i data-lucide="chevron-right" class="w-6 h-6"></i></button>` : ""}
              <button type="button" aria-label="진행 상태 저장" onclick="Actions.saveNow()" class="p-2.5 rounded-full hover:bg-slate-100 active:bg-slate-200"><i data-lucide="save" class="w-6 h-6"></i></button>
              <button type="button" aria-label="리포트 복사" onclick="copyReport()" class="p-2.5 rounded-full hover:bg-slate-100 active:bg-slate-200"><i data-lucide="copy" class="w-6 h-6"></i></button>
              <button type="button" aria-label="처음 화면으로" onclick="setState({step:0})" class="p-2.5 rounded-full hover:bg-slate-100 active:bg-slate-200"><i data-lucide="home" class="w-6 h-6"></i></button>
            </div>
          </div>
          ${cur ? `<div class="px-4 pb-2 flex items-center gap-3">
            <div class="h-1.5 bg-slate-200 rounded-full flex-1 overflow-hidden"><div class="h-full bg-blue-600 rounded-full transition-all" style="width:${pct}%"></div></div>
            <span class="t-meta font-bold text-slate-500 tabular-nums flex-shrink-0">${cur.n} / ${STAGES.length} · ${esc(cur.label)}</span>
          </div>` : ""}
        </header>`;
      }

      function dock(inner) {
        return `<div class="fixed bottom-0 left-0 right-0 px-5 pt-4 dock bg-white/97 backdrop-blur-md border-t border-slate-200 max-w-[430px] mx-auto z-[60] shadow-[0_-4px_20px_rgba(0,0,0,.06)]">${inner}</div>`;
      }

      function primaryBtn(label, onclick, disabled) {
        return `<button type="button" ${disabled ? "disabled" : ""} onclick="${onclick}"
          class="w-full py-5 rounded-2xl font-bold t-h3 text-white bg-slate-900 hover:bg-slate-800 disabled:bg-slate-300 disabled:text-slate-500 shadow-lg active:scale-[0.98] transition-all">${esc(label)}</button>`;
      }

      function instructionBox(id, onSend, placeholder) {
        return `<section class="p-6 bg-slate-800 rounded-3xl shadow-xl mt-10">
          <h3 class="t-label text-blue-300 mb-3">AI 수정 지시</h3>
          <div class="flex gap-2">
            <input type="text" id="${id}" value="${escAttr(draft(id))}" oninput="setDraft('${id}', this.value)"
              class="flex-1 bg-white/10 border border-white/20 rounded-xl px-4 py-3.5 text-white t-small outline-none placeholder:text-slate-400 focus:border-blue-400"
              placeholder="${escAttr(placeholder)}" aria-label="수정 지시 입력">
            <button type="button" aria-label="수정 요청 보내기" onclick="${onSend}" class="bg-blue-600 hover:bg-blue-500 text-white px-4 rounded-xl active:scale-95 transition-all"><i data-lucide="send" class="w-5 h-5"></i></button>
          </div>
        </section>`;
      }

      function qaBox(inputId, contextKey) {
        const hist = state.qaHistory;
        return `<section class="p-6 bg-slate-700 rounded-3xl shadow-xl mt-6">
          <h3 class="t-label text-blue-200 mb-3">AI에게 질문하기</h3>
          <div class="flex gap-2">
            <input type="text" id="${inputId}" value="${escAttr(draft(inputId))}" oninput="setDraft('${inputId}', this.value)"
              class="flex-1 bg-white/10 border border-white/20 rounded-xl px-4 py-3.5 text-white t-small outline-none placeholder:text-slate-300 focus:border-blue-400"
              placeholder="분석 결과에 대해 궁금한 점" aria-label="질문 입력">
            <button type="button" aria-label="질문 보내기" onclick="Actions.askAI('${inputId}','${contextKey}')" class="bg-blue-600 hover:bg-blue-500 text-white px-4 rounded-xl active:scale-95 transition-all"><i data-lucide="send" class="w-5 h-5"></i></button>
          </div>
          ${hist.length ? `
          <button type="button" onclick="setState({showQaHistory:${!state.showQaHistory}})" class="mt-4 t-meta font-bold text-blue-200 flex items-center gap-1.5">
            <i data-lucide="${state.showQaHistory ? "chevron-up" : "chevron-down"}" class="w-4 h-4"></i> 지난 질문 ${hist.length}건 ${state.showQaHistory ? "접기" : "보기"}
          </button>
          ${state.showQaHistory ? `<div class="mt-4 space-y-4 max-h-72 overflow-y-auto no-scrollbar">
            ${hist.slice().reverse().map(h => `<div class="bg-white/5 rounded-2xl p-4 border border-white/10">
              <p class="t-meta font-bold text-blue-200 mb-1">Q. ${esc(h.q)}</p>
              <p class="t-small text-slate-200 prose-ko">${esc(h.a)}</p></div>`).join("")}
          </div>` : ""}` : ""}
        </section>`;
      }

      /* =========================================================
         13. 리포트 복사
         ========================================================= */
      window.copyReport = async function () {
        const L = [];
        L.push("==================================================");
        L.push("   TREND INSIGHT LAB 분석 리포트");
        L.push("==================================================", "");
        L.push(`[1. 분석 대상 연도] ${state.selectedYear}년`, "");

        if (state.step1Keywords.length) {
          L.push("[2. 선택 트렌드]");
          state.step1Keywords.forEach(k => {
            L.push(`● ${k.kr} (${k.en})`, `  요약: ${k.summary}`);
            L.push("");
          });
        }
        if (state.steepResult) {
          L.push("[3. 과거-현재 STEEP 분석]");
          state.steepResult.forEach(item => {
            L.push(`■ ${item.keyword}`);
            ["past", "present"].forEach(t => {
              L.push(`  <${TIMELINE_LABEL[t]}>`, `   ${item.timeline[t].desc}`);
              Object.entries(item.timeline[t].steep).forEach(([k, v]) => L.push(`   - ${STEEP_LABEL[k.toLowerCase()] || k.toUpperCase()}: ${v}`));
            });
            L.push("");
          });
        }
        if (state.futureScenario) {
          L.push(`[4. 미래 예측 트렌드 (${state.targetYear}년)]`);
          state.futureScenario.trends.forEach((t, i) => {
            L.push(`● #${i + 1}${state.selectedScenarioIndex === i ? " (선택됨)" : ""}: ${t.futureTrendKeyword}`);
            L.push(`  특성: ${t.characteristics}`, `  시나리오: ${t.userScenario}`, "");
          });
        }
        if (state.researchTopic) L.push("[5. 추론 과제]", `- ${state.researchTopic}`, "");
        if (state.reasoningResult) {
          L.push("[6. 통합 인사이트]");
          state.reasoningResult.insights.forEach((ins, i) => {
            L.push(`${i + 1}. ${ins.headline}${state.selectedInsightIndex === i ? " (선택됨)" : ""}`, `   ${ins.description}`);
          });
          L.push("");
        }
        if (state.allGeneratedConcepts.length) {
          L.push("[7. 디자인 컨셉 (누적)]");
          state.allGeneratedConcepts.forEach((c, i) => {
            L.push(`● 컨셉 #${i + 1} [${c.perspective || "General"} 관점]: ${c.title}`);
            if (c.persona) L.push(`  타겟: ${c.persona}`);
            if (c.description) L.push(`  개요: ${c.description}`);
            L.push(`  핵심가치: ${c.coreValue}`);
            (c.keyFeatures || []).forEach(f => L.push(`   · ${f.title}${f.desc ? ": " + f.desc : ""}`));
            L.push("");
          });
        }
        if (state.benchmarkResult) {
          L.push(`[8. 케이스스터디 — ${state.benchmarkResult.selectedConceptName}]`);
          state.benchmarkResult.cases.forEach((c, i) => {
            L.push(`▶ Case #${i + 1}. ${c.caseName}`, `  특징: ${c.caseCharacteristics}`,
              `  성공 요인: ${c.successFactor}`, `  비즈니스 결과: ${c.businessResult}`, `  확장 가능성: ${c.expansionFactor}`, "");
          });
        }
        if (state.qaHistory.length) {
          L.push("[9. AI Q&A 기록]");
          state.qaHistory.forEach((h, i) => L.push(`질문 ${i + 1}: ${h.q}`, `답변: ${h.a}`, ""));
        }

        const txt = L.join("\n");
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(txt);
          } else {
            const ta = document.createElement("textarea");
            ta.value = txt; ta.setAttribute("readonly", "");
            ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
            document.body.appendChild(ta); ta.select();
            const ok = document.execCommand("copy");
            document.body.removeChild(ta);
            if (!ok) throw new Error("copy rejected");
          }
          toast("리포트를 클립보드에 복사했습니다.", "ok");
        } catch (e) {
          console.error(e);
          toast("복사에 실패했습니다. 브라우저 권한을 확인해 주세요.", "error");

      function viewSelect() {
        const list = TREND_DATA[state.selectedYear].map(item => {
          const on = state.step1Keywords.some(k => k.code === item.code);
          const open = !!state.expanded[item.code];

              <button type="button" class="flex-1 text-left min-w-0" aria-expanded="${open}" onclick="toggleExpand('${item.code}')">
                <h3 class="t-h3 text-slate-900 mb-0.5">${esc(item.kr)}</h3>
                <p class="t-meta text-slate-500 italic">${esc(item.en)}</p>
              </button>
              <button type="button" onclick="Actions.toggleKeyword('${item.code}')" aria-pressed="${on}"
                class="px-4 py-2.5 rounded-full t-meta font-bold flex-shrink-0 transition-all active:scale-95 ${on ? "bg-blue-600 text-white shadow-md" : "bg-slate-100 text-slate-700 hover:bg-slate-200"}">${on ? "선택됨" : "선택"}</button>

        }).join("");

        const n = state.step1Keywords.length;
        return `<div class="pt-24 px-4 dock-space animate-fade-in">

          <div class="flex gap-2 mb-6" role="group" aria-label="연도 선택">
            ${["2024", "2025", "2026"].map(y => `<button type="button" onclick="setState({selectedYear:'${y}'})" aria-pressed="${state.selectedYear === y}"

              <button type="button" aria-label="${escAttr(k.kr)} 선택 해제" onclick="Actions.toggleKeyword('${k.code}')" class="p-0.5 rounded-full hover:bg-white/20"><i data-lucide="x" class="w-4 h-4"></i></button></span>`).join("")}</div>` : ""}
            ${primaryBtn(n ? `선택한 ${n}개로 과거·현재 분석` : "트렌드를 선택해 주세요", "Actions.runSteep()", n === 0)}

      }

      function viewSteep() {
        const body = state.steepResult.map(item => `
          <section class="bg-white rounded-[2rem] p-6 shadow-sm border border-slate-200">
            <h2 class="t-h1 text-slate-900 mb-7 flex items-center gap-3"><span class="w-2 h-8 bg-blue-900 rounded-full"></span>${esc(item.keyword)}</h2>
            ${["past", "present"].map(t => `<div class="mb-9 last:mb-0">
              <h3 class="t-label text-blue-700 mb-3">${esc(TIMELINE_LABEL[t])}</h3>
              <p class="t-body text-slate-800 prose-ko mb-5">${esc(item.timeline[t].desc)}</p>
              <dl class="bg-slate-50 p-5 rounded-2xl border border-slate-200 space-y-3">
                ${Object.entries(item.timeline[t].steep).map(([k, v]) => `<div>

          ${header("예측 연도 설정", 2)}

          <output id="year-display" for="year-range" class="block t-display text-center text-indigo-600 mb-10" style="font-size:64px">${state.targetYear}</output>
          <label for="year-range" class="sr-only">목표 연도</label>
          <input type="range" id="year-range" min="2026" max="2035" step="1" value="${state.targetYear}"
            aria-valuemin="2026" aria-valuemax="2035" aria-valuenow="${state.targetYear}"
            oninput="document.getElementById('year-display').textContent=this.value; this.setAttribute('aria-valuenow', this.value); setDraft('targetYear', parseInt(this.value,10));"
            class="w-full appearance-none bg-transparent cursor-pointer">
          <div class="flex justify-between t-meta text-slate-500 mt-2"><span>2026</span><span>2035</span></div>
          ${dock(primaryBtn("미래 예측하기", "Actions.runScenario()"))}
        </div>`;
      }

      function viewScenario() {
        const cards = state.futureScenario.trends.map((sc, i) => {
          const on = state.selectedScenarioIndex === i;
          return `<section class="mb-10 last:mb-0 animate-fade-in">
            <div class="bg-slate-900 rounded-[2rem] p-7 text-white mb-5 shadow-xl border-2 ${on ? "border-blue-500" : "border-transparent"}">
              <div class="flex items-center justify-between gap-3 mb-3">
                <span class="t-label text-blue-300">미래 트렌드 ${i + 1}</span>
                <button type="button" aria-pressed="${on}" onclick="setState({selectedScenarioIndex:${i}, ...invalidateFrom(7)})"
                  class="px-5 py-2 rounded-full t-meta font-bold transition-all active:scale-95 flex-shrink-0 ${on ? "bg-blue-600 text-white" : "bg-white/10 text-white border border-white/30 hover:bg-white/20"}">${on ? "선택됨" : "선택"}</button>

                <h3 class="t-label text-indigo-700 mb-2">사용자 행동 시나리오</h3>

          ${cards}
          ${instructionBox("scenario-instruction", "Actions.runScenario(document.getElementById('scenario-instruction').value)", "예: 더 경제적인 관점으로 수정")}

          ${dock(primaryBtn(picked ? "통합 추론 진행" : "트렌드를 하나 선택해 주세요", "setState({step:5})", !picked))}
        </div>`;
      }

      function viewTopic() {
        return `<div class="pt-24 px-6 min-h-screen flex flex-col justify-center animate-fade-in dock-space">

          <i data-lucide="lightbulb" class="w-12 h-12 text-amber-500 mb-6"></i>

      function viewReasoning() {
        const cards = state.reasoningResult.insights.map((ins, i) => {
          const on = state.selectedInsightIndex === i;
          return `<article class="bg-white p-6 rounded-[2rem] shadow-sm border-2 transition-all ${on ? "border-blue-600 bg-blue-50/50" : "border-slate-200"}">
            <div class="flex items-center justify-between gap-3 mb-4">
              <span class="t-label text-blue-700">Insight ${i + 1}</span>

                class="px-4 py-2 rounded-full t-meta font-bold flex-shrink-0 transition-all active:scale-95 ${on ? "bg-blue-600 text-white shadow-md" : "bg-slate-100 text-slate-700 hover:bg-slate-200"}">${on ? "선택됨" : "선택"}</button>
            </div>

        return `<div class="pt-24 px-4 dock-space animate-fade-in">
          ${header("통합 인사이트", 5)}
          <h2 class="t-h1 text-slate-900 mb-2">통합 추론 리포트</h2>

          ${dock(primaryBtn(picked ? "디자인 컨셉 제안받기" : "인사이트를 하나 선택해 주세요", "Actions.runIdeation()", !picked))}
        </div>`;
      }

      function viewConcepts() {
        const PERSPECTIVES = [["General", "종합 관점"], ["Humanities", "인문 관점"], ["Tech", "기술 관점"], ["Business", "비즈니스 관점"]];
        const cards = state.concepts.map((c, i) => {
          const cv = esc(c.coreValue).replace(/(Who:|Purpose:|Service:)/g, '<span class="text-blue-700 font-bold">$1</span>');
          return `<article class="animate-fade-in">
            ${c.persona ? `<p class="t-small text-indigo-700 font-bold mb-3 px-1 prose-ko">${esc(c.persona)}</p>` : ""}
            <div class="bg-white rounded-[2rem] p-6 shadow-sm border border-slate-200">
              <h3 class="t-h1 text-slate-900 mb-6">${i + 1}. ${esc(c.title)}</h3>
              <div class="space-y-7">
                ${c.description ? `<div><h4 class="t-label text-slate-500 mb-2">개요</h4><p class="t-body text-slate-700 prose-ko">${esc(c.description)}</p></div>` : ""}
                <div><h4 class="t-label text-slate-500 mb-2">핵심 가치</h4><p class="t-body font-medium text-slate-800 prose-ko">${cv}</p></div>
                ${c.keyFeatures.length ? `<div><h4 class="t-label text-slate-500 mb-3">주요 기능</h4>
                  <ul class="space-y-4">${c.keyFeatures.map(f => `<li>
                    <p class="t-h3 text-slate-900">${esc(f.title)}</p>
                    ${f.desc ? `<p class="t-small text-slate-600 prose-ko">${esc(f.desc)}</p>` : ""}</li>`).join("")}</ul></div>` : ""}
              </div>
              <button type="button" onclick="Actions.runBenchmark(${i})"
                class="w-full mt-8 py-4 bg-slate-800 hover:bg-slate-700 text-white rounded-2xl font-bold t-small flex items-center justify-center gap-2 active:scale-[0.98] transition-all">
                <i data-lucide="search" class="w-5 h-5"></i> 이 컨셉으로 사례 찾기</button>
            </div>
          </article>`;
        }).join("");

        return `<div class="pt-24 px-4 dock-space animate-fade-in">
          ${header("디자인 컨셉", 6)}
          <div class="space-y-10">${cards}</div>
          <section class="mt-10">
            <h3 class="t-label text-slate-500 mb-3">관점을 바꿔 다시 제안받기</h3>
            <div class="grid grid-cols-2 gap-2.5">
              ${PERSPECTIVES.map(([key, label]) => `<button type="button" onclick="setState({perspective:'${key}'}); Actions.runIdeation();"
                class="bg-white border-2 py-3.5 rounded-2xl t-small font-bold transition-all ${state.perspective === key ? "border-blue-600 bg-blue-50 text-blue-800" : "border-slate-200 text-slate-600 hover:border-slate-300"}">${esc(label)}</button>`).join("")}
            </div>
            <p class="t-meta text-slate-500 mt-3">지금까지 생성한 컨셉 ${state.allGeneratedConcepts.length}개는 리포트 복사에 모두 포함됩니다.</p>
          </section>
          ${instructionBox("ideation-instruction", "Actions.runIdeation(document.getElementById('ideation-instruction').value)", "예: 타겟을 더 좁혀서 다시 제안")}
          ${qaBox("qa-concepts", "concepts")}
        </div>`;
      }

      function viewBenchmark() {
        const b = state.benchmarkResult;
        const blocks = b.cases.map(c => `
          <section class="animate-fade-in">
            <div class="bg-slate-900 rounded-[2rem] p-7 text-white mb-5 shadow-xl">
              <span class="inline-block bg-blue-600 t-meta font-bold px-3 py-1 rounded-full mb-3">CASE STUDY</span>
              <h2 class="t-h1 italic mb-4">${esc(c.caseName)}</h2>
              <p class="t-small text-slate-200 bg-white/5 p-5 rounded-2xl border border-white/10 prose-ko">${esc(c.caseCharacteristics)}</p>

                 ["비즈니스 결과", c.businessResult, "text-indigo-700", "bg-indigo-600"],
                 ["가설 확장성", c.expansionFactor, "text-purple-700", "bg-purple-600"]]
            .map(([label, val, textCls, dotCls]) => `<div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                  <h3 class="t-label ${textCls} mb-3 flex items-center gap-2"><span class="w-2 h-2 rounded-full ${dotCls}"></span>${esc(label)}</h3>

          </div>
          <div class="space-y-10">${blocks}</div>
          ${instructionBox("benchmark-instruction", "Actions.runBenchmark(null, document.getElementById('benchmark-instruction').value)", "예: 해외 스타트업 사례 위주로")}
          ${qaBox("qa-benchmark", "benchmarkResult")}
        </div>`;
      }

      function overlays() {
        let html = "";

        if (state.isAnalyzing) {
          html += `<div class="fixed inset-0 z-[10000] bg-white/95 backdrop-blur-sm flex flex-col items-center justify-center px-8 text-center max-w-[430px] mx-auto animate-fade-in" role="status" aria-live="polite">
            <div class="spinner-ring mb-8" role="presentation"></div>
            <h2 class="t-h2 text-slate-900 mb-2">${esc(state.loadingMsg)}</h2>
            <p class="t-small text-slate-500 mb-8">최대 1분 정도 걸릴 수 있습니다</p>
            <button type="button" onclick="Actions.cancel()" class="px-7 py-3.5 rounded-2xl border-2 border-slate-300 text-slate-700 font-bold t-small hover:bg-slate-50 active:scale-95 transition-all">취소</button>
          </div>`;
        }

        if (state.errorMsg) {
          html += `<div class="fixed inset-0 z-[10002] flex items-center justify-center bg-black/50 px-6 backdrop-blur-sm" role="alertdialog" aria-modal="true" aria-labelledby="err-title">
            <div class="bg-white p-8 rounded-3xl w-full max-w-sm text-center shadow-2xl animate-scale-in">
              <i data-lucide="alert-triangle" class="text-red-600 mx-auto mb-4 w-12 h-12"></i>
              <h2 id="err-title" class="t-h3 text-slate-900 mb-6">${esc(state.errorMsg)}</h2>
              <button type="button" onclick="setState({errorMsg:null})" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold t-small">확인</button>
            </div>
          </div>`;
        }

        if (state.qaModal.visible) {
          html += `<div class="fixed inset-0 z-[10001] flex items-center justify-center bg-black/60 px-6 backdrop-blur-sm animate-fade-in" role="dialog" aria-modal="true" aria-labelledby="qa-title">
            <div class="bg-slate-800 text-white p-7 rounded-3xl w-full max-w-sm shadow-2xl animate-scale-in relative border border-white/10">
              <button type="button" aria-label="답변 닫기" onclick="setState({qaModal:{visible:false,question:'',answer:''}})" class="absolute top-4 right-4 p-2 rounded-full text-slate-300 hover:bg-white/10"><i data-lucide="x" class="w-6 h-6"></i></button>
              <h2 id="qa-title" class="t-label text-blue-300 mb-5">AI 컨설턴트 답변</h2>
              <div class="space-y-4 max-h-[60vh] overflow-y-auto no-scrollbar">
                <div class="p-4 bg-white/5 rounded-2xl border border-white/10">
                  <p class="t-meta font-bold text-slate-400 mb-1">Q.</p>
                  <p class="t-small text-white">${esc(state.qaModal.question)}</p>
                </div>
                <p class="t-body text-slate-100 prose-ko">${esc(state.qaModal.answer)}</p>
              </div>
            </div>
          </div>`;
        }
        return html;
      }

      /* =========================================================
         15. 메인 렌더 — 예외가 나도 화면이 멈추지 않도록 방어
         ========================================================= */
      function captureUI() {
        const el = document.activeElement;
        const f = (el && el.id && (el.tagName === "INPUT" || el.tagName === "TEXTAREA"))
          ? { id: el.id, start: el.selectionStart, end: el.selectionEnd } : null;
        return { focus: f, scrollY: window.scrollY };
      }
      function restoreUI(snap, resetScroll) {
        if (snap.focus) {
          const el = document.getElementById(snap.focus.id);
          if (el) {
            el.focus({ preventScroll: true });
            try { el.setSelectionRange(snap.focus.start, snap.focus.end); } catch (e) { /* range 미지원 타입 */ }
          }
        }
        window.scrollTo(0, resetScroll ? 0 : snap.scrollY);
      }

      function body() {
        switch (state.step) {
          case -1: return viewAuth();
          case 0: return viewHome();
          case 1: return viewSelect();
          case 2: return state.steepResult ? viewSteep() : fallback(1, "과거·현재 분석 결과가 없습니다.");
          case 3: return state.steepResult ? viewYear() : fallback(2, "먼저 과거·현재 분석을 완료해 주세요.");
          case 4: return state.futureScenario ? viewScenario() : fallback(3, "미래 트렌드 예측 결과가 없습니다.");
          case 5: return state.futureScenario ? viewTopic() : fallback(4, "먼저 미래 트렌드를 예측해 주세요.");
          case 6: return state.reasoningResult ? viewReasoning() : fallback(5, "통합 인사이트 결과가 없습니다.");
          case 7: return state.concepts.length ? viewConcepts() : fallback(6, "디자인 컨셉 결과가 없습니다.");
          case 8: return state.benchmarkResult ? viewBenchmark() : fallback(7, "케이스스터디 결과가 없습니다.");
          default: return fallback(0, "요청한 화면을 찾을 수 없습니다.");
        }
      }

      function fallback(backStep, msg) {
        return `<div class="pt-28 px-6 min-h-screen">
          <div class="bg-white border border-slate-200 rounded-3xl p-8 text-center shadow-sm">
            <i data-lucide="compass" class="w-12 h-12 text-slate-400 mx-auto mb-4"></i>
            <h2 class="t-h3 text-slate-900 mb-2">${esc(msg)}</h2>
            <p class="t-small text-slate-500 mb-6">이전 단계로 돌아가 다시 실행해 주세요.</p>
            ${primaryBtn("이전 단계로", `setState({step:${backStep}})`)}
          </div>
        </div>`;
      }

      function render(resetScroll) {
        const root = document.getElementById("root");
        const snap = captureUI();
        const shell = "w-full max-w-[430px] mx-auto bg-slate-50 min-h-screen relative overflow-x-hidden shadow-2xl";
        let inner;
        try {
          inner = body();
        } catch (err) {
          // 기존 구조에서는 여기서 예외가 나면 innerHTML 대입 자체가 실행되지 않아
          // "버튼을 눌렀는데 아무 일도 일어나지 않는" 상태가 됐음.
          console.error("render 실패:", err);
          inner = fallback(0, "화면을 그리는 중 문제가 발생했습니다.");
        }
        try {
          root.innerHTML = `<div class="${shell}">${inner}${overlays()}</div>`;
          if (window.lucide && typeof lucide.createIcons === "function") lucide.createIcons();
        } catch (err) {
          console.error("DOM 갱신 실패:", err);
          root.innerHTML = `<div class="${shell}"><div class="p-8 t-body">화면을 표시할 수 없습니다. 새로고침해 주세요.</div></div>`;
        }
        restoreUI(snap, resetScroll);
      }

      /* =========================================================
         16. 전역 헬퍼 & 부팅
         ========================================================= */
      window.toggleExpand = (code) => setState({ expanded: { ...state.expanded, [code]: !state.expanded[code] } });
      window.invalidateFrom = invalidateFrom;

      document.addEventListener("keydown", (e) => {
        if (e.key !== "Escape") return;
        if (state.qaModal.visible) setState({ qaModal: { visible: false, question: "", answer: "" } });
        else if (state.errorMsg) setState({ errorMsg: null });
        else if (state.isAnalyzing) Actions.cancel();
      });

      // 연도 슬라이더 값은 draft에 보관 → 예측 실행 직전에 state로 반영
      const _runScenario = Actions.runScenario.bind(Actions);
      Actions.runScenario = function (instruction) {
        const y = drafts.targetYear;
        if (y && y !== state.targetYear) state.targetYear = y;
        return _runScenario(instruction);
      };

      setInterval(() => { try { persist(false); } catch (e) { console.warn("자동 저장 실패", e); } }, CONFIG.AUTOSAVE_MS);
      window.addEventListener("beforeunload", () => { try { persist(false); } catch (e) { /* 무시 */ } });

      render(true);
    })();
  </script>
</body>
</html>
